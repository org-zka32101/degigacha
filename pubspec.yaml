name: gachacho
description: "デジタルガチャ帳 - ガチャの戦利品を撮るだけで自動認識・図鑑化するアプリ"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  state_notifier: ^1.0.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.10.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.3.0
  firebase_remote_config: ^4.3.0

  # Camera & Image
  camera: ^0.10.5+2
  image_picker: ^1.0.4
  image: ^4.0.17

  # Networking
  http: ^1.1.0
  dio: ^5.3.1

  # UI/UX
  flutter_lottie: ^2.0.0
  go_router: ^12.1.1
  google_fonts: ^6.1.0
  material_design_icons_flutter: ^7.0.0

  # Local Notifications
  flutter_local_notifications: ^14.1.1

  # Shared Preferences
  shared_preferences: ^2.2.2

  # In-App Purchases
  in_app_purchase: ^5.1.0

  # Riverpod CLI Support
  riverpod_generator: ^2.3.0

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Logging
  logger: ^2.0.1

  # Date & Time
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0

  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.0

  # Coverage
  coverage: ^7.2.1

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/sounds/
    - .env

  fonts:
    - family: GoogleFonts
      fonts:
        - asset: assets/fonts/Noto_Sans_JP/NotoSansJP-Regular.ttf
        - asset: assets/fonts/Noto_Sans_JP/NotoSansJP-Bold.ttf
          weight: 700
